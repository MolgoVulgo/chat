name: CI

on:
  push:
  pull_request:

jobs:
  python-and-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest platformio

      - name: Validate pattern JSON
        run: python -m tools.chatchat_patterns validate tools/examples/default_patterns.json

      - name: Check generated default pattern pack
        run: |
          python tools/generate_default_patterns_c.py
          git diff --exit-code -- src/default_patterns.c src/default_patterns.h

      - name: Run Python tests
        run: python -m pytest

      - name: Build ESP8266 firmware
        run: pio run -e d1_mini_pro
