; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = dev

[env]
platform = espressif8266
board = d1_mini_pro
framework = esp8266-rtos-sdk
monitor_speed = 115200

board_build.ldscript = ld/eagle.app.v6.single.ld
board_build.flash_mode = dio
board_build.f_flash = 80000000
board_build.flash_size = 16MB
board_build.filesystem = spiffs
board_build.spiffs_start = 0xE00000
board_build.spiffs_end = 0x1000000

[flags_prod]
build_flags =
    -DAPP_LOG_ENABLED=0
    -DPATTERN_LOG_ENABLED=0
    -DHARDWARE_LOG_ENABLED=0
    -DWEB_LOG_ENABLED=0
    -DWEB_DEBUG_LOG_ENABLED=0
    -DPATTERN_SPIFFS_ADDR=0xE00000
    -DPATTERN_SPIFFS_SIZE=0x200000

[flags_dev]
build_flags =
    -DAPP_LOG_ENABLED=1
    -DPATTERN_LOG_ENABLED=1
    -DHARDWARE_LOG_ENABLED=1
    -DWEB_LOG_ENABLED=1
    -DWEB_DEBUG_LOG_ENABLED=1
    -DPATTERN_SPIFFS_ADDR=0xE00000
    -DPATTERN_SPIFFS_SIZE=0x200000

[env:prod]
build_flags = ${flags_prod.build_flags}

[env:dev]
build_flags = ${flags_dev.build_flags}
